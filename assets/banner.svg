<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#4f46e5" fill-opacity="0.4" />
    </pattern>

    <!-- Drop Shadow / Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #c7d2fe;
      letter-spacing: 0.5px;
    }
    .node-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }
    .subnode-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 11px;
      fill: #64748b;
    }

    /* Ambient Pulsing Glow Animations */
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.15); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .orb-1 {
      animation: pulseOrb 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 9s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }
    .flowing-path {
      stroke-dasharray: 8, 6;
      animation: flowLine 2.5s linear infinite;
    }
    .flow-card-1 {
      animation: floatCard 6s ease-in-out infinite;
    }
    .flow-card-2 {
      animation: floatCard 6s ease-in-out infinite 1.5s;
    }
    .flow-card-3 {
      animation: floatCard 6s ease-in-out infinite 3s;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Background Dynamic Glowing Orbs -->
  <circle class="orb-1" cx="220" cy="120" r="160" fill="#6366f1" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="280" r="180" fill="#ec4899" filter="url(#glow)" />

  <!-- Animated Data Flow Lines (Behind text) -->
  <g opacity="0.35">
    <path class="flowing-path" d="M 50 370 Q 300 390 550 360 T 1150 370" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="flowing-path" d="M 50 390 Q 350 410 650 380 T 1150 390" fill="none" stroke="#06b6d4" stroke-width="1.5" />
  </g>

  <!-- FOREGROUND CONTENT: Header & Badges (Stays Crisp & Fully Visible) -->
  <g transform="translate(70, 48)">
    <!-- Top Pill / Category Tag -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="url(#pillGrad)" stroke="#4338ca" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="badge-text">AUTONOMOUS QUALITY ENGINEERING</text>

    <!-- Main Title -->
    <text x="0" y="86" class="title-text" fill="url(#primaryGrad)">
      Generative AI Test Case Authoring
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="124" class="subtitle-text">
      The Curated Ecosystem for AI-Driven Spec-to-Test, Automated QA &amp; Self-Healing Suites
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 150)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="72" y="18" text-anchor="middle" class="badge-text" fill="#94a3b8">⚡ LLM Test Synthesis</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="135" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="222" y="18" text-anchor="middle" class="badge-text" fill="#94a3b8">🤖 Autonomous QA</text>

      <!-- Pill 3 -->
      <rect x="300" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="365" y="18" text-anchor="middle" class="badge-text" fill="#94a3b8">🔄 Self-Healing</text>

      <!-- Pill 4 -->
      <rect x="440" y="0" width="150" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="515" y="18" text-anchor="middle" class="badge-text" fill="#94a3b8">🛡️ Open-Source Agents</text>
    </g>
  </g>

  <!-- DYNAMIC ARCHITECTURE FLOW PIPELINE (Bottom Section) -->
  <g transform="translate(70, 260)">
    <!-- Node 1: Requirements / User Stories -->
    <g class="flow-card-1" transform="translate(0, 0)">
      <rect width="210" height="92" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="16" y="16" width="34" height="34" rx="8" fill="#1e293b" />
      <text x="33" y="38" text-anchor="middle" font-size="18">📝</text>
      <text x="62" y="34" class="node-text">Requirements</text>
      <text x="62" y="48" class="subnode-text">User Stories &amp; OpenAPI</text>
      <path d="M 16 68 L 194 68" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="81" font-size="10" fill="#64748b" font-family="sans-serif">Input: Jira / Specs / Docs</text>
    </g>

    <!-- Connecting Path 1 -->
    <path class="flowing-path" d="M 215 46 L 275 46" fill="none" stroke="#6366f1" stroke-width="2.5" />
    <polygon points="278,46 270,41 270,51" fill="#6366f1" />

    <!-- Node 2: GenAI Reasoning Agent Engine -->
    <g class="flow-card-2" transform="translate(285, 0)">
      <rect width="240" height="92" rx="12" fill="#111827" stroke="#6366f1" stroke-width="2" filter="url(#cardShadow)"/>
      <rect x="16" y="16" width="34" height="34" rx="8" fill="#312e81" />
      <text x="33" y="38" text-anchor="middle" font-size="18">🧠</text>
      <text x="62" y="34" class="node-text" fill="#a5b4fc">AI Authoring Agent</text>
      <text x="62" y="48" class="subnode-text">LLM Analysis &amp; Heuristics</text>
      <path d="M 16 68 L 224 68" stroke="#1f2937" stroke-width="1" />
      <text x="16" y="81" font-size="10" fill="#818cf8" font-family="sans-serif">Boundary &amp; Negative Matrix</text>
    </g>

    <!-- Connecting Path 2 -->
    <path class="flowing-path" d="M 530 46 L 590 46" fill="none" stroke="#a855f7" stroke-width="2.5" />
    <polygon points="593,46 585,41 585,51" fill="#a855f7" />

    <!-- Node 3: Synthesized Executable Suites -->
    <g class="flow-card-3" transform="translate(600, 0)">
      <rect width="220" height="92" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="16" y="16" width="34" height="34" rx="8" fill="#1e293b" />
      <text x="33" y="38" text-anchor="middle" font-size="18">🧪</text>
      <text x="62" y="34" class="node-text">Test Case Suites</text>
      <text x="62" y="48" class="subnode-text">pytest / Playwright / JUnit</text>
      <path d="M 16 68 L 204 68" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="81" font-size="10" fill="#10b981" font-family="sans-serif">Verified Pass / Coverage ↑</text>
    </g>

    <!-- Connecting Path 3 (Feedback Loop / Self-Healing) -->
    <path class="flowing-path" d="M 825 46 L 885 46" fill="none" stroke="#ec4899" stroke-width="2.5" />
    <polygon points="888,46 880,41 880,51" fill="#ec4899" />

    <!-- Node 4: Self-Healing & Verification -->
    <g class="flow-card-1" transform="translate(895, 0)">
      <rect width="165" height="92" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="14" y="16" width="34" height="34" rx="8" fill="#1e293b" />
      <text x="31" y="38" text-anchor="middle" font-size="18">🚀</text>
      <text x="56" y="34" class="node-text">CI / CD Run</text>
      <text x="56" y="48" class="subnode-text">Self-Healing Loop</text>
      <path d="M 14 68 L 151 68" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="81" font-size="10" fill="#ec4899" font-family="sans-serif">Zero-Maintenance</text>
    </g>
  </g>

  <!-- Outer Border Accent -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="0" fill="none" stroke="#1e293b" stroke-width="1" />
</svg>
